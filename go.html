<!DOCTYPE html>
<!--
  営業メールのクリック計測用の中継ページ（旧 Wix Velo ページ /go の置き換え。2026-11-07 Cloudflare Pages 移行時に復旧）。
  URL: https://www.eureka-consult.com/go?k=<トークン>&u=<b|s>
  役割: クリックを Apps Script（営業メール送信リストのトラッキングWebアプリ）に記録してから、
        予約ページ（u=b）または会社サイト（u=s）へ自動で移動する。移動先は下の2つに固定（他のURLへは転送しない）。
  元コード: 03_事業/V001_.../営業送信/ツール/mail_sender/relay/go_wix_velo.js
-->
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>eureka///CONSULTING</title>
<style>
  body{font-family:"Noto Sans JP","Hiragino Kaku Gothic ProN",Meiryo,sans-serif;text-align:center;padding:60px 20px;color:#222;background:#fff}
  .brand{font-size:14px;color:#666;margin-bottom:28px}
  a.btn{display:inline-block;background:#0C3C60;color:#fff;text-decoration:none;font-size:18px;font-weight:bold;padding:16px 32px;border-radius:8px;min-width:240px}
  p{color:#666;font-size:13px;line-height:1.7}
</style>
</head>
<body>
<div class="brand">eureka///CONSULTING</div>
<p>移動しています…</p>
<a class="btn" id="go" href="https://www.eureka-consult.com/" rel="noopener">開く</a>
<p>自動で移動しない場合は、上のボタンを押してください。</p>
<script>
(function () {
  var WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbxuCeTZbKWeqmxprJuMn_zM-5yBHdryQyyXQKmxQeLCLrgxIHVD0xjHssVgnrNmEoxVEg/exec';
  var DEST = {
    b: 'https://calendar.google.com/calendar/appointments/schedules/AcZssZ3B_Oknvu9D6HwfgpC72u31F6hANczH7InZVVF3t31bd68LSMf8ciK-EhYN6NQKPqj9R4vx3wLi',
    s: 'https://www.eureka-consult.com/'
  };
  var q = new URLSearchParams(location.search);
  var u = q.get('u') === 'b' ? 'b' : 's';
  var k = q.get('k') || '';
  var dest = DEST[u];
  var btn = document.getElementById('go');
  btn.href = dest;
  btn.textContent = u === 'b' ? '予約ページを開く' : 'eureka///CONSULTING のサイトを開く';
  var done = false;
  function go() { if (done) return; done = true; location.replace(dest); }
  if (/^[A-Za-z0-9-]{8,64}$/.test(k)) {
    var url = WEBAPP_URL + '?t=c&r=1&k=' + encodeURIComponent(k) + '&u=' + u;
    // 記録は最大1.2秒だけ待ち、終わらなくても移動する
    // Apps Script は GET で受けるため、GET のまま送る（sendBeacon は POST になるので使わない）
    var p = null;
    try { p = fetch(url, { mode: 'no-cors', keepalive: true, credentials: 'omit' }); }
    catch (e) { try { new Image().src = url; } catch (e2) {} }
    if (p && p.then) { p.then(go, go); }
    setTimeout(go, 1200);
  } else {
    setTimeout(go, 300);
  }
})();
</script>
</body>
</html>
