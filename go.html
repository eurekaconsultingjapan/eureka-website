<!DOCTYPE html>
<!--
  営業メールのクリック計測用の中継ページ（旧 Wix Velo ページ /go の置き換え。2026-11-07 Cloudflare Pages 移行時に復旧）。
  URL: https://www.eureka-consult.com/go?k=<トークン>&u=<b|s>
  役割: クリックを (1) 営業メール送信リストのトラッキングWebアプリ（Apps Script）、(2) GA4、(3) サイトCRM（assets/analytics.js）に記録してから、
        予約ページ（u=b）または会社サイト（u=s）へ自動で移動する。移動先は下の2つに固定（他のURLへは転送しない）。
  テスト: &stay=1 を付けると移動せず、この画面に記録の結果を表示する。
  元コード: 03_事業/V001_.../営業送信/ツール/mail_sender/relay/go_wix_velo.js
-->
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>eureka///CONSULTING</title>
<script src="assets/site-config.js"></script>
<script src="assets/analytics.js" defer></script>
<style>
  body{font-family:"Noto Sans JP","Hiragino Kaku Gothic ProN",Meiryo,sans-serif;text-align:center;padding:60px 20px;color:#222;background:#fff}
  .brand{font-size:14px;color:#666;margin-bottom:28px}
  a.btn{display:inline-block;background:#0C3C60;color:#fff;text-decoration:none;font-size:18px;font-weight:bold;padding:16px 32px;border-radius:8px;min-width:240px}
  p{color:#666;font-size:13px;line-height:1.7}
  #st{font-size:12px;color:#999;white-space:pre-line}
</style>
</head>
<body data-page="mail_relay">
<div class="brand">eureka///CONSULTING</div>
<p>移動しています…</p>
<a class="btn" id="go" href="https://www.eureka-consult.com/" rel="noopener">開く</a>
<p>自動で移動しない場合は、上のボタンを押してください。</p>
<p id="st"></p>
<script>
(function () {
  var WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbxuCeTZbKWeqmxprJuMn_zM-5yBHdryQyyXQKmxQeLCLrgxIHVD0xjHssVgnrNmEoxVEg/exec';
  var DEST = {
    b: 'https://calendar.google.com/calendar/appointments/schedules/AcZssZ3B_Oknvu9D6HwfgpC72u31F6hANczH7InZVVF3t31bd68LSMf8ciK-EhYN6NQKPqj9R4vx3wLi',
    s: 'https://www.eureka-consult.com/'
  };
  var q = new URLSearchParams(location.search);
  var u = q.get('u') === 'b' ? 'b' : 's';
  var k = q.get('k') || '';
  var stay = q.get('stay') === '1';
  var dest = DEST[u];
  var btn = document.getElementById('go');
  var st = document.getElementById('st');
  btn.href = dest;
  btn.textContent = u === 'b' ? '予約ページを開く' : 'eureka///CONSULTING のサイトを開く';
  function log(m) { if (stay) st.textContent += m + '\n'; }
  var done = false;
  function go() { if (done) return; done = true; if (stay) { log('（stay=1 のため移動しません）'); return; } location.replace(dest); }

  /* (2) GA4: 営業メールのクリックをイベントで記録（analytics.js が gtag を用意する。ga4Id が空なら何もしない） */
  var asDone = false, gaDone = false;
  function tryGo() { if (asDone && gaDone) go(); }
  function ga() {
    try {
      var C = window.EU_CONFIG || {};
      if (!C.ga4Id) { log('GA4: 測定IDなし'); gaDone = true; tryGo(); return; }
      window.dataLayer = window.dataLayer || [];
      function gtag() { dataLayer.push(arguments); }
      gtag('event', 'mail_link_click', {
        link_target: u === 'b' ? 'booking' : 'site', mail_token: k.slice(0, 64), page_path: '/go', transport_type: 'beacon',
        event_timeout: 1200,
        event_callback: function () { log('GA4: mail_link_click 送信完了（' + C.ga4Id + '）'); gaDone = true; tryGo(); }
      });
      log('GA4: mail_link_click を送信中（' + C.ga4Id + '）');
    } catch (e) { gaDone = true; tryGo(); }
  }
  if (document.readyState === 'complete') ga(); else window.addEventListener('load', ga);

  /* (1) 送信リストのトラッキングWebアプリへ記録（GET。sendBeacon は POST になるため使わない） */
  if (/^[A-Za-z0-9-]{8,64}$/.test(k)) {
    var url = WEBAPP_URL + '?t=c&r=1&k=' + encodeURIComponent(k) + '&u=' + u;
    var p = null;
    try { p = fetch(url, { mode: 'no-cors', keepalive: true, credentials: 'omit' }); }
    catch (e) { try { new Image().src = url; } catch (e2) {} }
    if (p && p.then) {
      p.then(function () { log('送信リスト: 記録リクエスト完了（' + k + ' / u=' + u + '）'); asDone = true; tryGo(); },
             function (e) { log('送信リスト: 送信失敗 ' + e); asDone = true; tryGo(); });
    } else { asDone = true; }
    // 記録（送信リスト・GA4）は合わせて最大1.5秒だけ待ち、終わらなくても移動する
    setTimeout(go, 1500);
  } else {
    log('送信リスト: トークンなし（記録しない）');
    asDone = true;
    setTimeout(go, 1000);
  }
})();
</script>
</body>
</html>
